<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="output.css">
</head>
<body class="m-0 overflow-hidden bg-transparent h-screen flex flex-col items-center justify-end pb-[5px]">
    <div class="group flex flex-col items-center p-[10px] mb-[-10px]" id="hover-area">
        <div class="bg-black text-[#d1d5db] py-[6px] px-[14px] rounded-[20px] text-[11px] font-sans font-medium mb-2 opacity-0 translate-y-1 transition-all duration-200 flex items-center gap-1 leading-normal group-hover:opacity-100 group-hover:translate-y-0 [&.visible]:opacity-100 [&.visible]:translate-y-0" id="tooltip">
            Click or hold <span class="text-[#ec4899] font-semibold">⌥ Opt ➔</span> to start dictating
        </div>
        <div class="bg-black/40 rounded-[4px] p-0 flex items-center justify-center gap-[2px] transition-all duration-200 cursor-default w-9 h-2 overflow-hidden group-hover:bg-black/85 group-hover:rounded-full group-hover:py-[6px] group-hover:px-[10px] group-hover:w-auto group-hover:min-w-[48px] group-hover:h-7 group-hover:overflow-visible [&.hovered]:bg-black/85 [&.hovered]:rounded-full [&.hovered]:py-[6px] [&.hovered]:px-[10px] [&.hovered]:w-auto [&.hovered]:min-w-[48px] [&.hovered]:h-7 [&.hovered]:overflow-visible [&.recording]:bg-black/85 [&.recording]:rounded-full [&.recording]:py-[6px] [&.recording]:px-[10px] [&.recording]:w-auto [&.recording]:min-w-[48px] [&.recording]:h-7 [&.recording]:overflow-visible [&.loading]:bg-black/85 [&.loading]:rounded-full [&.loading]:py-[6px] [&.loading]:px-[10px] [&.loading]:w-auto [&.loading]:min-w-[48px] [&.loading]:h-7 [&.loading]:overflow-visible group/pill" id="pill">
            <div class="flex items-center gap-[2px] h-4 group-[.loading]/pill:hidden" id="wave-container">
            </div>
            <svg class="w-3.5 h-3.5 animate-spin hidden text-[#e4e4e7] group-[.loading]/pill:block" id="spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
    </div>

    <script src="overlay_renderer.js"></script>
</body>
</html>
